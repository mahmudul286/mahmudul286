<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="auto" role="img" aria-label="Mahmudul Hasan — AI &amp; Robotics Research">
  <defs>
    <!-- Deep gradient background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E27"/>
      <stop offset="50%" stop-color="#070B1F"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>

    <!-- Soft central glow -->
    <radialGradient id="coreGlow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#7B2FF7" stop-opacity="0.20"/>
      <stop offset="40%" stop-color="#00D4FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
    </radialGradient>

    <!-- Node gradients -->
    <radialGradient id="nCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#7B2FF7"/>
      <stop offset="100%" stop-color="#7B2FF7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nMagenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#FF2D75"/>
      <stop offset="100%" stop-color="#FF2D75" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="glowS" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowL" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle hex grid -->
    <pattern id="hex" x="0" y="0" width="48" height="42" patternUnits="userSpaceOnUse">
      <path d="M24 0 L48 14 L48 28 L24 42 L0 28 L0 14 Z" fill="none" stroke="#1F2547" stroke-width="0.3" opacity="0.4"/>
    </pattern>

    <!-- Horizon accent -->
    <linearGradient id="hLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D4FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7B2FF7" stop-opacity="0"/>
    </linearGradient>

    <!-- Name gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A8B2D1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="440" fill="url(#bg)"/>
  <rect width="1200" height="440" fill="url(#hex)" opacity="0.3"/>
  <rect width="1200" height="440" fill="url(#coreGlow)"/>

  <!-- Horizon lines -->
  <rect x="0" y="50" width="1200" height="1" fill="url(#hLine)" opacity="0.7"/>
  <rect x="0" y="390" width="1200" height="1" fill="url(#hLine)" opacity="0.45"/>

  <!-- Left thin circuit traces -->
  <g stroke="#1F2547" stroke-width="0.6" fill="none" opacity="0.75">
    <path d="M0 210 L70 210 L90 190 L90 140 L130 120"/>
    <circle cx="90" cy="190" r="1.6" fill="#00D4FF" opacity="0.85"/>
    <path d="M0 300 L50 300 L70 280 L70 230"/>
    <circle cx="70" cy="280" r="1.6" fill="#7B2FF7" opacity="0.85"/>
    <path d="M0 360 L40 360 L60 340"/>
    <circle cx="60" cy="340" r="1.4" fill="#00D4FF" opacity="0.7"/>
  </g>

  <!-- Right thin circuit traces -->
  <g stroke="#1F2547" stroke-width="0.6" fill="none" opacity="0.75">
    <path d="M1200 220 L1130 220 L1110 200 L1110 150 L1070 130"/>
    <circle cx="1110" cy="200" r="1.6" fill="#00D4FF" opacity="0.85"/>
    <path d="M1200 310 L1150 310 L1130 290 L1130 240"/>
    <circle cx="1130" cy="290" r="1.6" fill="#FF2D75" opacity="0.85"/>
    <path d="M1200 370 L1160 370 L1140 350"/>
    <circle cx="1140" cy="350" r="1.4" fill="#7B2FF7" opacity="0.7"/>
  </g>

  <!-- LEFT NEURAL MESH — 4-layer sparse network -->
  <!-- Connection lines (background) -->
  <g stroke="#00D4FF" stroke-width="0.5" fill="none" opacity="0.28">
    <line x1="220" y1="150" x2="300" y2="120"/>
    <line x1="220" y1="150" x2="300" y2="190"/>
    <line x1="220" y1="150" x2="300" y2="260"/>
    <line x1="220" y1="210" x2="300" y2="120"/>
    <line x1="220" y1="210" x2="300" y2="190"/>
    <line x1="220" y1="210" x2="300" y2="260"/>
    <line x1="220" y1="210" x2="300" y2="330"/>
    <line x1="220" y1="270" x2="300" y2="190"/>
    <line x1="220" y1="270" x2="300" y2="260"/>
    <line x1="220" y1="270" x2="300" y2="330"/>

    <line x1="300" y1="120" x2="380" y2="170"/>
    <line x1="300" y1="120" x2="380" y2="240"/>
    <line x1="300" y1="190" x2="380" y2="170"/>
    <line x1="300" y1="190" x2="380" y2="240"/>
    <line x1="300" y1="190" x2="380" y2="310"/>
    <line x1="300" y1="260" x2="380" y2="240"/>
    <line x1="300" y1="260" x2="380" y2="310"/>
    <line x1="300" y1="330" x2="380" y2="310"/>

    <line x1="380" y1="170" x2="450" y2="220"/>
    <line x1="380" y1="240" x2="450" y2="220"/>
    <line x1="380" y1="310" x2="450" y2="220"/>
  </g>

  <!-- Animated pulses along key paths -->
  <g stroke="#00D4FF" stroke-width="1.1" fill="none" opacity="0.9" filter="url(#glowS)">
    <line x1="220" y1="210" x2="300" y2="190" stroke-dasharray="3 48">
      <animate attributeName="stroke-dashoffset" from="0" to="-51" dur="2.2s" repeatCount="indefinite"/>
    </line>
    <line x1="300" y1="190" x2="380" y2="240" stroke-dasharray="3 48">
      <animate attributeName="stroke-dashoffset" from="0" to="-51" dur="2.6s" repeatCount="indefinite"/>
    </line>
    <line x1="380" y1="240" x2="450" y2="220" stroke-dasharray="3 48">
      <animate attributeName="stroke-dashoffset" from="0" to="-51" dur="2.4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Layer 1 (input) -->
  <g filter="url(#glowS)">
    <circle cx="220" cy="150" r="3.5" fill="url(#nCyan)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="210" r="4.5" fill="url(#nCyan)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3.2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="270" r="3.5" fill="url(#nCyan)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.4s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Layer 2 (hidden) -->
  <g filter="url(#glowS)">
    <circle cx="300" cy="120" r="3" fill="url(#nPurple)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="190" r="3.5" fill="url(#nPurple)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="260" r="3" fill="url(#nPurple)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="330" r="2.8" fill="url(#nPurple)">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.4s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Layer 3 (hidden) -->
  <g filter="url(#glowS)">
    <circle cx="380" cy="170" r="3.2" fill="url(#nCyan)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.6s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="240" r="4" fill="url(#nCyan)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.8s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="310" r="3.2" fill="url(#nCyan)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Layer 4 (output) -->
  <g filter="url(#glowL)">
    <circle cx="450" cy="220" r="5" fill="url(#nMagenta)">
      <animate attributeName="r" values="5;7;5" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- RIGHT NEURAL MESH — mirror, sparser, purple-led -->
  <g stroke="#7B2FF7" stroke-width="0.5" fill="none" opacity="0.22">
    <line x1="750" y1="170" x2="830" y2="150"/>
    <line x1="750" y1="170" x2="830" y2="220"/>
    <line x1="750" y1="170" x2="830" y2="290"/>
    <line x1="750" y1="240" x2="830" y2="220"/>
    <line x1="750" y1="240" x2="830" y2="290"/>
    <line x1="750" y1="310" x2="830" y2="290"/>
    <line x1="830" y1="220" x2="910" y2="200"/>
    <line x1="830" y1="220" x2="910" y2="260"/>
    <line x1="830" y1="290" x2="910" y2="260"/>
    <line x1="910" y1="260" x2="980" y2="230"/>
  </g>

  <!-- Right pulses -->
  <g stroke="#7B2FF7" stroke-width="1.1" fill="none" opacity="0.85" filter="url(#glowS)">
    <line x1="750" y1="240" x2="830" y2="290" stroke-dasharray="3 48">
      <animate attributeName="stroke-dashoffset" from="0" to="-51" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="830" y1="290" x2="910" y2="260" stroke-dasharray="3 48">
      <animate attributeName="stroke-dashoffset" from="0" to="-51" dur="2.7s" repeatCount="indefinite"/>
    </line>
    <line x1="910" y1="260" x2="980" y2="230" stroke-dasharray="3 48">
      <animate attributeName="stroke-dashoffset" from="0" to="-51" dur="2.3s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Right nodes -->
  <g filter="url(#glowS)">
    <circle cx="750" cy="170" r="3" fill="url(#nPurple)">
      <animate attributeName="opacity" values="0.5;0.95;0.5" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="240" r="3.5" fill="url(#nPurple)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.2s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="310" r="3" fill="url(#nPurple)">
      <animate attributeName="opacity" values="0.5;0.95;0.5" dur="2.8s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="830" cy="220" r="2.8" fill="url(#nCyan)">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="830" cy="290" r="3" fill="url(#nCyan)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="910" cy="200" r="2.5" fill="url(#nCyan)">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.5s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="910" cy="260" r="3.2" fill="url(#nCyan)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.7s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g filter="url(#glowL)">
    <circle cx="980" cy="230" r="5" fill="url(#nMagenta)">
      <animate attributeName="r" values="5;7;5" dur="2.6s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2.6s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Floating particles -->
  <g>
    <circle cx="140" cy="80" r="1.3" fill="#00D4FF" opacity="0.5">
      <animate attributeName="cy" values="80;64;80" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.85;0.3" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1060" cy="370" r="1.3" fill="#00D4FF" opacity="0.5">
      <animate attributeName="cy" values="370;354;370" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.85;0.3" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="70" r="1.1" fill="#7B2FF7" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.75;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="540" cy="380" r="1.1" fill="#FF2D75" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.75;0.2" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="370" r="1" fill="#7B2FF7" opacity="0.35">
      <animate attributeName="opacity" values="0.15;0.65;0.15" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="80" r="1" fill="#00D4FF" opacity="0.35">
      <animate attributeName="opacity" values="0.15;0.65;0.15" dur="7.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Corner brackets -->
  <g stroke="#00D4FF" stroke-width="0.8" fill="none" opacity="0.35">
    <path d="M24 24 L24 44 M24 24 L44 24"/>
    <path d="M1176 24 L1176 44 M1176 24 L1156 24"/>
    <path d="M24 416 L24 396 M24 416 L44 416"/>
    <path d="M1176 416 L1176 396 M1176 416 L1156 416"/>
  </g>

  <!-- CENTER CONTENT -->
  <g text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <!-- Top kicker -->
    <text x="600" y="120" font-size="10" letter-spacing="7" fill="#00D4FF" opacity="0.7">
      AUTONOMOUS INTELLIGENCE · RESEARCH
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4s" repeatCount="indefinite"/>
    </text>

    <!-- Name -->
    <text x="600" y="225" font-size="58" font-weight="600" letter-spacing="2" fill="url(#nameGrad)">
      Mahmudul Hasan
    </text>

    <!-- Subtitle -->
    <text x="600" y="260" font-size="13" letter-spacing="5" fill="#8892B0" opacity="0.85">
      AI · ROBOTICS · EMBEDDED · RESEARCH
    </text>
  </g>

  <!-- Center accent -->
  <g>
    <line x1="540" y1="285" x2="585" y2="285" stroke="#00D4FF" stroke-width="0.6" opacity="0.5"/>
    <line x1="615" y1="285" x2="660" y2="285" stroke="#7B2FF7" stroke-width="0.6" opacity="0.5"/>
    <circle cx="600" cy="285" r="2.2" fill="#00D4FF" opacity="0.85">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Bottom mono labels -->
  <g font-family="ui-monospace, 'SF Mono', monospace" font-size="9" fill="#1F2547">
    <text x="40" y="422" letter-spacing="2">[ 0x00 // NEURAL.CORE ]</text>
    <text x="1160" y="422" text-anchor="end" letter-spacing="2">[ BANGLADESH · 2026 ]</text>
  </g>
</svg>
