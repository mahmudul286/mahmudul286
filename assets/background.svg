<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="auto" role="img" aria-label="Background texture">
  <defs>
    <linearGradient id="bBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E27"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>

    <pattern id="bHex" x="0" y="0" width="50" height="43" patternUnits="userSpaceOnUse">
      <path d="M25 0 L50 14.5 L50 28.5 L25 43 L0 28.5 L0 14.5 Z" fill="none" stroke="#1F2547" stroke-width="0.3" opacity="0.45"/>
    </pattern>

    <pattern id="bDots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="0.6" fill="#1F2547" opacity="0.7"/>
    </pattern>

    <radialGradient id="bCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bBg)"/>
  <rect width="1200" height="400" fill="url(#bHex)" opacity="0.4"/>
  <rect width="1200" height="400" fill="url(#bDots)" opacity="0.5"/>
  <rect width="1200" height="400" fill="url(#bCenterGlow)"/>

  <line x1="0" y1="80" x2="1200" y2="80" stroke="#00D4FF" stroke-width="0.3" opacity="0.2"/>
  <line x1="0" y1="320" x2="1200" y2="320" stroke="#7B2FF7" stroke-width="0.3" opacity="0.2"/>

  <g stroke="#1F2547" stroke-width="0.5" fill="none" opacity="0.55">
    <path d="M0 150 L80 150 L100 170 L100 230 L160 250"/>
    <path d="M1200 180 L1100 180 L1080 200 L1080 260 L1020 280"/>
    <path d="M0 280 L60 280 L80 260 L80 200"/>
    <path d="M1200 300 L1140 300 L1120 280 L1120 220"/>
    <circle cx="100" cy="170" r="1.2" fill="#00D4FF" opacity="0.6"/>
    <circle cx="1080" cy="200" r="1.2" fill="#7B2FF7" opacity="0.6"/>
  </g>

  <g fill="#00D4FF" opacity="0.5">
    <circle cx="150" cy="100" r="1">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="120" r="1" fill="#7B2FF7">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="350" r="0.8">
      <animate attributeName="opacity" values="0.1;0.7;0.1" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="330" r="0.8" fill="#FF2D75">
      <animate attributeName="opacity" values="0.1;0.7;0.1" dur="5.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
