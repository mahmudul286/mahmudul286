<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="auto" role="img" aria-label="Mission Control">
  <defs>
    <linearGradient id="mcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E27"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>

    <linearGradient id="mcPanel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F1535" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0A0E27" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="mcLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7B2FF7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="mcGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7B2FF7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7B2FF7" stop-opacity="0"/>
    </radialGradient>

    <!-- Coffee level meter gradient -->
    <linearGradient id="mcCoffee" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#7B2FF7"/>
    </linearGradient>

    <pattern id="mcHex" x="0" y="0" width="50" height="43" patternUnits="userSpaceOnUse">
      <path d="M25 0 L50 14.5 L50 28.5 L25 43 L0 28.5 L0 14.5 Z" fill="none" stroke="#1F2547" stroke-width="0.3" opacity="0.4"/>
    </pattern>

    <filter id="mcGlowF" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="360" fill="url(#mcBg)" rx="8"/>
  <rect width="1000" height="360" fill="url(#mcHex)" opacity="0.3"/>
  <rect width="1000" height="360" fill="url(#mcGlow)" rx="8"/>

  <!-- Top & bottom accent lines -->
  <rect x="40" y="22" width="920" height="1" fill="url(#mcLine)"/>
  <rect x="40" y="338" width="920" height="1" fill="url(#mcLine)" opacity="0.5"/>

  <!-- Header -->
  <g font-family="ui-monospace, 'SF Mono', monospace">
    <text x="40" y="50" font-size="11" fill="#00D4FF" letter-spacing="3" opacity="0.9">▸ MISSION.CONTROL</text>
    <text x="960" y="50" font-size="9" fill="#8892B0" letter-spacing="2" text-anchor="end">SYSTEM STATUS · LIVE</text>
  </g>

  <!-- Header status dot -->
  <g filter="url(#mcGlowF)">
    <circle cx="940" cy="46" r="3" fill="#00D4FF">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Status panel (top row of cards) -->
  <!-- Card 1: STATUS -->
  <g transform="translate(40, 75)">
    <rect width="210" height="70" rx="6" fill="url(#mcPanel)" stroke="#1F2547" stroke-width="0.5"/>
    <text x="14" y="22" font-family="ui-monospace, monospace" font-size="9" fill="#8892B0" letter-spacing="2">STATUS</text>
    <text x="14" y="50" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">Learning</text>
    <circle cx="190" cy="20" r="3" fill="#00D4FF" filter="url(#mcGlowF)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Card 2: CURRENT FOCUS -->
  <g transform="translate(265, 75)">
    <rect width="210" height="70" rx="6" fill="url(#mcPanel)" stroke="#1F2547" stroke-width="0.5"/>
    <text x="14" y="22" font-family="ui-monospace, monospace" font-size="9" fill="#8892B0" letter-spacing="2">CURRENT FOCUS</text>
    <text x="14" y="50" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#7B2FF7">Swarm Robotics</text>
  </g>

  <!-- Card 3: RESEARCH MODE -->
  <g transform="translate(490, 75)">
    <rect width="210" height="70" rx="6" fill="url(#mcPanel)" stroke="#1F2547" stroke-width="0.5"/>
    <text x="14" y="22" font-family="ui-monospace, monospace" font-size="9" fill="#8892B0" letter-spacing="2">RESEARCH MODE</text>
    <text x="14" y="50" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" fill="#FF2D75">Active</text>
    <!-- Active pulse indicator -->
    <g transform="translate(180, 30)">
      <circle r="8" fill="none" stroke="#FF2D75" stroke-width="0.6" opacity="0.6">
        <animate attributeName="r" values="6;12;6" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0;0.7" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle r="4" fill="#FF2D75" filter="url(#mcGlowF)">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Card 4: OPEN SOURCE -->
  <g transform="translate(715, 75)">
    <rect width="245" height="70" rx="6" fill="url(#mcPanel)" stroke="#1F2547" stroke-width="0.5"/>
    <text x="14" y="22" font-family="ui-monospace, monospace" font-size="9" fill="#8892B0" letter-spacing="2">OPEN SOURCE</text>
    <text x="14" y="50" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" fill="#00D4FF">Exploring</text>
  </g>

  <!-- Coffee Level meter (wide card) -->
  <g transform="translate(40, 165)">
    <rect width="920" height="80" rx="6" fill="url(#mcPanel)" stroke="#1F2547" stroke-width="0.5"/>

    <!-- Label -->
    <text x="20" y="28" font-family="ui-monospace, monospace" font-size="9" fill="#8892B0" letter-spacing="2">COFFEE.LEVEL</text>
    <text x="20" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#FFFFFF" opacity="0.7">Fuel for autonomous systems</text>

    <!-- Meter bar background -->
    <rect x="380" y="32" width="500" height="14" rx="7" fill="#0A0E27" stroke="#1F2547" stroke-width="0.4"/>

    <!-- Meter segments (8 filled, 2 empty = 80%) -->
    <g>
      <rect x="384" y="36" width="58" height="6" rx="3" fill="url(#mcCoffee)" filter="url(#mcGlowF)">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
      </rect>
      <rect x="446" y="36" width="58" height="6" rx="3" fill="url(#mcCoffee)" filter="url(#mcGlowF)">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" begin="0.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="508" y="36" width="58" height="6" rx="3" fill="url(#mcCoffee)" filter="url(#mcGlowF)">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" begin="0.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="570" y="36" width="58" height="6" rx="3" fill="url(#mcCoffee)" filter="url(#mcGlowF)">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" begin="0.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="632" y="36" width="58" height="6" rx="3" fill="url(#mcCoffee)" filter="url(#mcGlowF)">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" begin="0.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="694" y="36" width="58" height="6" rx="3" fill="url(#mcCoffee)" filter="url(#mcGlowF)">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" begin="1s" repeatCount="indefinite"/>
      </rect>
      <rect x="756" y="36" width="58" height="6" rx="3" fill="url(#mcCoffee)" filter="url(#mcGlowF)">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" begin="1.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="818" y="36" width="58" height="6" rx="3" fill="url(#mcCoffee)" filter="url(#mcGlowF)">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" begin="1.4s" repeatCount="indefinite"/>
      </rect>
      <!-- Empty segments -->
      <rect x="880" y="36" width="16" height="6" rx="3" fill="#1F2547" opacity="0.4"/>
    </g>

    <!-- Percentage -->
    <text x="892" y="60" font-family="ui-monospace, monospace" font-size="11" fill="#00D4FF" text-anchor="end" letter-spacing="1">80%</text>

    <!-- Tick marks under meter -->
    <g font-family="ui-monospace, monospace" font-size="7" fill="#1F2547">
      <text x="384" y="60">0%</text>
      <text x="632" y="60" text-anchor="middle">50%</text>
      <text x="880" y="60" text-anchor="end">100%</text>
    </g>
  </g>

  <!-- Bottom telemetry strip -->
  <g transform="translate(40, 270)">
    <rect width="920" height="55" rx="6" fill="url(#mcPanel)" stroke="#1F2547" stroke-width="0.5"/>

    <!-- Telemetry items -->
    <g font-family="ui-monospace, monospace">
      <!-- Item 1 -->
      <text x="20" y="22" font-size="8" fill="#8892B0" letter-spacing="2">UPTIME</text>
      <text x="20" y="40" font-size="13" fill="#FFFFFF">∞ days</text>

      <line x1="180" y1="12" x2="180" y2="44" stroke="#1F2547" stroke-width="0.5"/>

      <!-- Item 2 -->
      <text x="200" y="22" font-size="8" fill="#8892B0" letter-spacing="2">TIMEZONE</text>
      <text x="200" y="40" font-size="13" fill="#FFFFFF">Asia/Dhaka</text>

      <line x1="360" y1="12" x2="360" y2="44" stroke="#1F2547" stroke-width="0.5"/>

      <!-- Item 3 -->
      <text x="380" y="22" font-size="8" fill="#8892B0" letter-spacing="2">RESPONSE</text>
      <text x="380" y="40" font-size="13" fill="#00D4FF">~24h</text>

      <line x1="540" y1="12" x2="540" y2="44" stroke="#1F2547" stroke-width="0.5"/>

      <!-- Item 4 -->
      <text x="560" y="22" font-size="8" fill="#8892B0" letter-spacing="2">COLLAB</text>
      <text x="560" y="40" font-size="13" fill="#7B2FF7">Open</text>

      <line x1="720" y1="12" x2="720" y2="44" stroke="#1F2547" stroke-width="0.5"/>

      <!-- Item 5 -->
      <text x="740" y="22" font-size="8" fill="#8892B0" letter-spacing="2">MOOD</text>
      <text x="740" y="40" font-size="13" fill="#FF2D75">Building</text>

      <!-- Live indicator -->
      <g transform="translate(890, 28)">
        <circle r="3" fill="#00D4FF" filter="url(#mcGlowF)">
          <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <text x="-8" y="4" font-size="8" fill="#00D4FF" text-anchor="end" letter-spacing="2">LIVE</text>
      </g>
    </g>
  </g>

  <!-- Corner HUD ticks -->
  <g stroke="#00D4FF" stroke-width="0.6" fill="none" opacity="0.4">
    <path d="M14 14 L14 28 M14 14 L28 14"/>
    <path d="M986 14 L986 28 M986 14 L972 14"/>
    <path d="M14 346 L14 332 M14 346 L28 346"/>
    <path d="M986 346 L986 332 M986 346 L972 346"/>
  </g>
</svg>
