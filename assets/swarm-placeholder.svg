<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="100%" height="auto" role="img" aria-label="Swarm Network Visualization — coming soon">
  <defs>
    <linearGradient id="swBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E27"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>

    <linearGradient id="swLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7B2FF7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="swGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7B2FF7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#7B2FF7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="swNode" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="swNodeP" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#7B2FF7"/>
      <stop offset="100%" stop-color="#7B2FF7" stop-opacity="0"/>
    </radialGradient>

    <pattern id="swHex" x="0" y="0" width="50" height="43" patternUnits="userSpaceOnUse">
      <path d="M25 0 L50 14.5 L50 28.5 L25 43 L0 28.5 L0 14.5 Z" fill="none" stroke="#1F2547" stroke-width="0.3" opacity="0.4"/>
    </pattern>

    <filter id="swGlowF" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="swGlowL" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="440" fill="url(#swBg)" rx="8"/>
  <rect width="1000" height="440" fill="url(#swHex)" opacity="0.3"/>
  <rect width="1000" height="440" fill="url(#swGlow)" rx="8"/>

  <!-- Top accent -->
  <rect x="40" y="22" width="920" height="1" fill="url(#swLine)"/>

  <!-- Header -->
  <g font-family="ui-monospace, 'SF Mono', monospace">
    <text x="40" y="50" font-size="11" fill="#00D4FF" letter-spacing="3" opacity="0.9">▸ SWARM.NETWORK.VISUALIZATION</text>
    <text x="960" y="50" font-size="9" fill="#8892B0" letter-spacing="2" text-anchor="end">CONTRIBUTION MESH · CUSTOM BUILD</text>
  </g>

  <!-- Status badge -->
  <g transform="translate(940, 46)">
    <rect x="-58" y="-10" width="58" height="20" rx="10" fill="none" stroke="#FF2D75" stroke-width="0.6" opacity="0.6"/>
    <circle cx="-46" cy="0" r="2.5" fill="#FF2D75" filter="url(#swGlowF)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="-38" y="3" font-family="ui-monospace, monospace" font-size="8" fill="#FF2D75" letter-spacing="2">PENDING</text>
  </g>

  <!--
    Swarm placeholder visualization:
    A loose constellation of agent nodes with faint interconnections.
    Each node represents a future "agent" in the swarm.
    Connections are dashed/animated to suggest movement.
    Style is intentionally loose — a "wireframe" of what's coming.
  -->

  <!-- Faint swarm connections (decentralized mesh hint) -->
  <g stroke="#00D4FF" stroke-width="0.4" fill="none" opacity="0.18">
    <line x1="200" y1="160" x2="320" y2="120"/>
    <line x1="200" y1="160" x2="280" y2="220"/>
    <line x1="320" y1="120" x2="440" y2="180"/>
    <line x1="320" y1="120" x2="400" y2="260"/>
    <line x1="280" y1="220" x2="400" y2="260"/>
    <line x1="280" y1="220" x2="200" y2="300"/>
    <line x1="440" y1="180" x2="560" y2="140"/>
    <line x1="440" y1="180" x2="520" y2="240"/>
    <line x1="400" y1="260" x2="520" y2="240"/>
    <line x1="400" y1="260" x2="480" y2="320"/>
    <line x1="200" y1="300" x2="320" y2="340"/>
    <line x1="320" y1="340" x2="480" y2="320"/>
    <line x1="560" y1="140" x2="680" y2="200"/>
    <line x1="520" y1="240" x2="680" y2="200"/>
    <line x1="520" y1="240" x2="640" y2="300"/>
    <line x1="480" y1="320" x2="640" y2="300"/>
    <line x1="680" y1="200" x2="800" y2="160"/>
    <line x1="680" y1="200" x2="760" y2="260"/>
    <line x1="640" y1="300" x2="760" y2="260"/>
    <line x1="640" y1="300" x2="720" y2="340"/>
    <line x1="760" y1="260" x2="800" y2="160"/>
  </g>

  <!-- Animated swarm pulses (decentralized signal flow) -->
  <g stroke="#00D4FF" stroke-width="1" fill="none" opacity="0.7" filter="url(#swGlowF)">
    <line x1="320" y1="120" x2="440" y2="180" stroke-dasharray="2 38">
      <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="440" y1="180" x2="560" y2="140" stroke-dasharray="2 38">
      <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="2.8s" repeatCount="indefinite"/>
    </line>
    <line x1="560" y1="140" x2="680" y2="200" stroke-dasharray="2 38">
      <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="2.6s" repeatCount="indefinite"/>
    </line>
    <line x1="280" y1="220" x2="400" y2="260" stroke-dasharray="2 38" stroke="#7B2FF7">
      <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="520" y1="240" x2="640" y2="300" stroke-dasharray="2 38" stroke="#7B2FF7">
      <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="3.2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Swarm agent nodes -->
  <g filter="url(#swGlowF)">
    <!-- Row 1 -->
    <circle cx="200" cy="160" r="4" fill="url(#swNode)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="120" r="5" fill="url(#swNode)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.8s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="440" cy="180" r="4" fill="url(#swNode)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="140" r="5" fill="url(#swNodeP)" filter="url(#swGlowL)">
      <animate attributeName="r" values="5;7;5" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="200" r="4" fill="url(#swNode)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="160" r="4" fill="url(#swNode)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>

    <!-- Row 2 -->
    <circle cx="280" cy="220" r="4" fill="url(#swNodeP)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="260" r="5" fill="url(#swNodeP)" filter="url(#swGlowL)">
      <animate attributeName="r" values="5;7;5" dur="2.7s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.7s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="240" r="4" fill="url(#swNode)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="300" r="4" fill="url(#swNodeP)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="260" r="4" fill="url(#swNode)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.9s" begin="1.3s" repeatCount="indefinite"/>
    </circle>

    <!-- Row 3 -->
    <circle cx="200" cy="300" r="4" fill="url(#swNode)">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.4s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="340" r="4" fill="url(#swNodeP)">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.2s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="320" r="5" fill="url(#swNodeP)" filter="url(#swGlowL)">
      <animate attributeName="r" values="5;7;5" dur="2.8s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.8s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="340" r="4" fill="url(#swNode)">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Bottom info strip -->
  <g font-family="ui-monospace, monospace" font-size="9">
    <line x1="40" y1="380" x2="960" y2="380" stroke="#1F2547" stroke-width="0.5"/>

    <text x="40" y="402" fill="#8892B0" letter-spacing="2">[ AGENTS: 15 ]</text>
    <text x="500" y="402" text-anchor="middle" fill="#00D4FF" opacity="0.8" letter-spacing="2">DECENTRALIZED · MESH · AUTONOMOUS</text>
    <text x="960" y="402" text-anchor="end" fill="#8892B0" letter-spacing="2">[ TOPOLOGY: DYNAMIC ]</text>
  </g>

  <!-- Footer label inside the SVG -->
  <g font-family="ui-monospace, monospace" font-size="9" fill="#1F2547" opacity="0.7">
    <text x="40" y="422" letter-spacing="2">PLACEHOLDER · CUSTOM SVG INCOMING</text>
    <text x="960" y="422" text-anchor="end" letter-spacing="2">[ NOT A SNAKE · NOT A GAME ]</text>
  </g>

  <!-- Corner HUD ticks -->
  <g stroke="#00D4FF" stroke-width="0.6" fill="none" opacity="0.4">
    <path d="M14 14 L14 28 M14 14 L28 14"/>
    <path d="M986 14 L986 28 M986 14 L972 14"/>
    <path d="M14 426 L14 412 M14 426 L28 426"/>
    <path d="M986 426 L986 412 M986 426 L972 426"/>
  </g>
</svg>
