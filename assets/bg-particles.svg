<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="100%" height="auto" preserveAspectRatio="none" role="img" aria-label="background particles">
  <defs>
    <radialGradient id="bpDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bpDotP" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7B2FF7"/>
      <stop offset="100%" stop-color="#7B2FF7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bpDotM" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2D75"/>
      <stop offset="100%" stop-color="#FF2D75" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g opacity="0.6">
    <circle cx="80"   cy="30" r="2" fill="url(#bpDot)">
      <animate attributeName="cy" values="30;18;30" dur="6s"   repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220"  cy="20" r="1.5" fill="url(#bpDotP)">
      <animate attributeName="cy" values="20;35;20" dur="7.5s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="7.5s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380"  cy="40" r="2" fill="url(#bpDotM)">
      <animate attributeName="cy" values="40;22;40" dur="5.5s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="5.5s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="540"  cy="25" r="1.5" fill="url(#bpDot)">
      <animate attributeName="cy" values="25;40;25" dur="6.8s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="6.8s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700"  cy="35" r="2" fill="url(#bpDotP)">
      <animate attributeName="cy" values="35;18;35" dur="7s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="7s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860"  cy="20" r="1.5" fill="url(#bpDotM)">
      <animate attributeName="cy" values="20;38;20" dur="6.2s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="6.2s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="32" r="2" fill="url(#bpDot)">
      <animate attributeName="cy" values="32;16;32" dur="7.2s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="7.2s" begin="1.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1140" cy="22" r="1.5" fill="url(#bpDotP)">
      <animate attributeName="cy" values="22;40;22" dur="6.5s" begin="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="6.5s" begin="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
